<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AjraStoreBOT</title>

    <link rel="stylesheet" href="style.css">

    <!-- ICON -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!-- LOADING SCREEN -->

<div id="loading-screen">

    <div class="loader-box">
        <h1 class="loader-title">
            AjraStoreBOT
        </h1>

        <div class="loader-line"></div>
    </div>

</div>


<!-- MAIN CONTENT -->

<div class="container">

    <!-- HEADER -->

    <header>

        <h1>
            AjraStoreBOT
        </h1>

        <p>
            MENYEDIAKAN BERBAGAI PRODUK DAN SERVICE LORDSMOBILE
        </p>

    </header>


    <!-- SEARCH -->

    <div class="search-section">

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Cari IGG ID / CUSTOMER..."
            >

        </div>

        <button id="searchBtn">
            Cari Data
        </button>

    </div>


    <!-- SEARCH LOADING -->

    <div id="searchLoading">

        <h2>
            AjraStoreBOT
        </h2>

        <div class="search-loader"></div>

    </div>


    <!-- RESULT -->

    <div id="resultBox">

        <div class="card">

            <p><strong>IGG ID :</strong> <span id="igg"></span></p>

            <p><strong>CUSTOMER :</strong> <span id="customer"></span></p>

            <p><strong>USERNAME :</strong> <span id="username"></span></p>

            <p><strong>SERVER :</strong> <span id="server"></span></p>

            <p><strong>EXPIRED :</strong> <span id="expired"></span></p>

            <p><strong>STATUS :</strong> <span id="status"></span></p>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <a href="#">
        <i class="fab fa-instagram"></i>
        @ajrastoree
    </a>

    <a href="#">
        <i class="fab fa-tiktok"></i>
        @ajrastoremm
    </a>

</footer>


<!-- WHATSAPP BUBBLE -->

<a
href="https://wa.me/6285885385659"
class="whatsapp"
target="_blank"
>

<i class="fab fa-whatsapp"></i>

</a>


<!-- JAVASCRIPT -->

<script src="script.js"></script>

</body>
</html>
